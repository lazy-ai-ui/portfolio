<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1918" media="(prefers-color-scheme: dark)">
<!-- Пока сайт переделывается, поисковику здесь нечего индексировать. -->
<meta name="robots" content="noindex">
<title>Сайт переделывается · FIR</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Заглушка самодостаточна: стили портфолио она не тянет, потому что на время
     переделки все остальные адреса, включая css/, уводит на неё vercel.json.
     Открытыми оставлены только шрифты и иконка. -->
<style>
  @font-face{font-family:"Geist";src:url(/assets/fonts/geist-cyrillic.woff2) format("woff2");
    font-weight:100 900;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Geist";src:url(/assets/fonts/geist-latin.woff2) format("woff2");
    font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  :root{--bg:#F6F4F1;--ink:#0B0B0C;--ink-2:rgba(11,11,12,.62);--hair:rgba(11,11,12,.16);--accent:#E4573A}
  @media (prefers-color-scheme: dark){
    :root{--bg:#1A1918;--ink:#EDEBE8;--ink-2:rgba(237,235,232,.64);--hair:rgba(237,235,232,.18);--accent:#EE6144}
  }

  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}

  main{max-width:32rem}
  h1{margin:0;font-size:clamp(22px,4.4vw,30px);line-height:1.3;
    font-weight:500;letter-spacing:-.015em;text-wrap:pretty}
  a{color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--hair);transition:color .2s,border-color .2s}
  a:hover,a:focus-visible{color:var(--accent);border-color:var(--accent);outline:none}

  /* Загрузка собрана из того же словаря, что разделитель .rule на сайте:
     квадрат 5px с шагом 12px. Квадраты по очереди загораются коралловым,
     темнеют до цвета текста и гаснут той же волной, поэтому ряд всё время
     строится и рассыпается, ни разу не замирая целиком. */
  .load{display:flex;gap:7px;margin:0 0 28px}
  .load i{width:5px;height:5px;background:var(--hair);
    animation:build 2.4s calc(var(--i) * .12s) infinite both}
  @keyframes build{
    0%,100%{background:var(--hair)}
    8%{background:var(--accent)}
    18%,62%{background:var(--ink)}
    76%{background:var(--hair)}
  }
  @media (prefers-reduced-motion: reduce){
    .load i{animation:none;background:var(--ink)}
    .load i:first-child{background:var(--accent)}
  }
</style>
</head>
<body>
  <main>
    <div class="load" aria-hidden="true">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
      <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
    </div>
    <h1>Я переделываю портфолио, поэтому сейчас оно недоступно. Если что-то срочное, напишите мне в&nbsp;<a href="https://t.me/deadlif1" target="_blank" rel="noopener">Telegram</a>.</h1>
  </main>
</body>
</html>
